<body class="bg-[#0b1220] text-[#e6eef8] min-h-screen flex flex-col transition-colors duration-300">
  
  <nav class="w-full px-8 py-4 bg-[#07102a]/50 border-b border-white/5 backdrop-blur-md flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <div class="p-2 bg-cyan-500/10 rounded-xl border border-cyan-500/20">
        <img src="favicon.png" alt="Logo" class="w-6 h-6">
      </div>
      <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent">
        PPT → PDF
      </h1>
    </div>
    <div id="status" class="px-4 py-1 bg-cyan-500/10 rounded-full border border-cyan-500/20 text-[10px] font-bold uppercase tracking-widest text-cyan-400">
      System Ready
    </div>
  </nav>

  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <aside class="w-full lg:w-96 p-8 border-r border-white/5 bg-[#07102a]/30 flex flex-col gap-6">
      <div class="space-y-2">
        <h2 class="text-lg font-bold">Workspace</h2>
        <p class="text-sm text-[#93b2d9]">Upload and manage your PowerPoint presentations for conversion.</p>
      </div>

      <label id="drop" class="group relative flex flex-col items-center justify-center w-full h-64 border-2 border-dashed border-white/10 rounded-3xl bg-white/[0.02] hover:bg-cyan-500/[0.03] hover:border-cyan-500/40 transition-all cursor-pointer">
        <input id="file" type="file" accept=".ppt,.pptx" multiple class="hidden" />
        <div class="flex flex-col items-center text-center p-4">
          <div class="mb-4 p-4 bg-white/5 rounded-2xl group-hover:scale-110 transition-transform">
            <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <p class="font-bold text-sm">Add New Presentation</p>
          <p class="text-xs text-[#93b2d9] mt-1">Drag and drop files here</p>
        </div>
      </label>

      <div class="mt-auto space-y-4">
        <button id="convert" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-purple-600 hover:shadow-[0_8px_25px_rgba(6,182,212,0.3)] text-white font-black rounded-2xl transition-all active:scale-95 disabled:opacity-30">
          CONVERT TO PDF
        </button>
        <button id="reset" hidden class="w-full py-4 border border-white/10 hover:bg-white/5 text-[#93b2d9] font-bold rounded-2xl transition-all">
          CLEAR WORKSPACE
        </button>
      </div>
    </aside>

    <section id="content-wrapper" class="flex-1 bg-black/10 p-8 overflow-y-auto">
      <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-8">
          <h3 class="text-2xl font-black text-white">Active Queue</h3>
          <div id="result" class="flex items-center p-4 min-h-[80px] rounded-2xl transition-all"></div>
        </div>

        <div id="fileList" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
          </div>

        <div id="empty-state" class="flex flex-col items-center justify-center py-32 opacity-20">
           <svg class="w-24 h-24 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
           </svg>
           <p class="text-xl font-bold italic">No files in queue</p>
        </div>
      </div>
    </section>
  </main>

  <div id="progressWrap" hidden class="h-1.5 w-full bg-slate-900 overflow-hidden">
    <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-400 via-purple-500 to-cyan-400 transition-all duration-300" style="width: 0%"></div>
